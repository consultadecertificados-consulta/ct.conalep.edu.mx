<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="csrf-token" content="sdMeK1NSA38xO8YCdrdiqB72JydUjlmbcZAe5utD">

    <title>Certificado Digital - CONALEP</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link href="https://fonts.googleapis.com/css?family=Raleway:300,400,600" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.1.0/css/all.css" integrity="sha384-lKuwvrZot6UHsBSfcMvOkWwlCMgc0TaWr+30HWe3a4ltaBwTZhyTEggF5tJv8tbt" crossorigin="anonymous">
    <link href="https://ct.conalep.edu.mx/css/app.css" rel="stylesheet">
</head>
<body>
<div id="app">
    <nav class="navbar navbar-expand-md navbar-light navbar-laravel">
        <div class="container">
            <a class="navbar-brand" href="https://ct.conalep.edu.mx/home">
                <img src="https://ct.conalep.edu.mx/images/logoconalep.png" alt="Colegio Nacional de Educación Profesional Técnica - Cédula Digital">
            </a>
        </div>
    </nav>
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card bg-light">
                        <div class="card-header"><i class="fa fa-certificate"></i> Validación de certificados electrónicos Modelo 2018:</div>
                        <div class="card-body">

                            <!-- FORMULARIO DE BÚSQUEDA -->
                            <form id="formBuscar">
                                <div class="form-group">
                                    <label class="col-form-label" for="f">¿Desea consultar un folio de CONALEP?</label>
                                    <input class="form-control-sm form-control" type="text" id="f" required placeholder="Ejemplo: CBG1234567890">
                                    <small class="text-muted">Ejemplo: CBG1234567890</small>
                                </div>
                                <button class="btn btn-primary btn-sm" type="submit"><i class="fa fa-search"></i> Buscar</button>
                                <button type="button" id="btnBorrar" class="btn btn-secondary btn-sm">Limpiar</button>
                            </form>

                            <hr>
                            <div id="cajaResultado"></div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="folios.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const formBuscar = document.getElementById('formBuscar');
    const inputFolio = document.getElementById('f');
    const cajaResultado = document.getElementById('cajaResultado');
    const btnBorrar = document.getElementById('btnBorrar');

    // ✅ 1. LEER EL FOLIO DE LA URL Y PONERLO AUTOMÁTICAMENTE
    const parametrosURL = new URLSearchParams(window.location.search);
    const folioDeURL = parametrosURL.get('folio');

    // Si hay folio en la URL → se pone en el input y se busca SOLO
    if (folioDeURL) {
        inputFolio.value = folioDeURL.trim();
        // 🔍 Se ejecuta la búsqueda automáticamente
        buscarFolio(inputFolio.value.trim());
    }

    // ✅ Verificar base de datos
    if (typeof baseDatos === 'undefined') {
        cajaResultado.innerHTML = `<div class="alert alert-danger">⚠️ Error: No se cargó folios.js</div>`;
        return;
    }

    // 📌 Función principal de búsqueda
    function buscarFolio(folioIngresado) {
        cajaResultado.innerHTML = '';

        if (!folioIngresado) {
            cajaResultado.innerHTML = `<div class="alert alert-warning">Escribe un folio por favor</div>`;
            return;
        }

        // Buscar sin importar mayúsculas/minúsculas
        let folioEncontrado = null;
        let folioClave = null;

        for (let clave in baseDatos) {
            if (clave.trim().toUpperCase() === folioIngresado.toUpperCase()) {
                folioEncontrado = baseDatos[clave];
                folioClave = clave;
                break;
            }
        }

        if (folioEncontrado) {
            const d = folioEncontrado;
            cajaResultado.innerHTML = `
            <table class="table">
                <tbody>
                    <tr>
                        <tr><th colspan="2" class="text-center">Datos del estudiante</th></tr>
                <tr><th>Nombre(s) y apellido(s):</th><td>${d.nombre}</td></tr>
                <tr><th>Número de matrícula:</th><td>${d.matricula}</td></tr>
                <tr><th colspan="2" class="text-center">Datos del plantel o servicio educativo</th></tr>
                <tr><th>Institución educativa emisora:</th><td>${d.institucion}</td></tr>
                <tr><th>Plantel o servicio educativo:</th><td>${d.plantel}</td></tr>
                <tr><th>Clave de Centro de Trabajo:</th><td>${d.cct}</td></tr>
                <tr><th colspan="2" class="text-center">Trayectoria académica y datos del documento</th></tr>
                <tr><th>Plan de estudios:</th><td>Bachillerato, con la carrera Técnica en ${d.carrera} y el trayecto específico en ${d.trayecto}</td></tr>
                <tr><th>Promedio:</th><td>${d.promedio}</td></tr>
                <tr><th>Créditos obtenidos:</th><td>${d.creditos}</td></tr>
                <tr><th>Periodo de estudios:</th><td>${d.periodo}</td></tr>
                <tr><th>Tipo documento</th><td>${d.tipoDocumento}</td></tr>
                <tr><th>Estatus del documento</th><td>${d.estatus}</td></tr>
                <tr><th>Folio:</th><td>${d.folio}</td></tr>
                <tr><th>Fecha y hora de timbrado:</th><td>${d.fechaTimbrado}</td></tr>
            </tbody>
        </table>
        <div class="alert alert-success">
            Consulta la información del certificado en la página oficial del DGB dando clic en el siguiente botón:
            <a class="btn btn-outline-dark btn-sm" target="_blank" href="https://www.sep.dgb.bachillerato-gob.mx/?folio=${d.folio}">Verificar en DGB</a>
        </div>
        <div class="text-right">
            <a href="https://www.conalep.edu.mx" target="_blank">Portal CONALEP</a>
        </div>`;
    } else {
        // Si no existe
        caja.innerHTML = `<div class="alert alert-danger">El folio <strong>${folioIngresado}</strong> no está registrado.</div>`;
    }
});

// FUNCIÓN DEL BOTÓN LIMPIAR
document.getElementById('btnBorrar').addEventListener('click', function(){
    document.getElementById('f').value = '';
    document.getElementById('cajaResultado').innerHTML = '';
});
</script>

</body>
</html>
