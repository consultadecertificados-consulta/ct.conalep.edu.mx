<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Certificado Digital - CONALEP</title>
    <!-- ✅ AHORA VA DIRECTO, SIN CARPETA -->
    <script src="folios.js"></script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:300,400,600">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.1.0/css/all.css">
    <link rel="stylesheet" href="https://ct.conalep.edu.mx/css/app.css">
</head>
<body>
<div id="app">
    <nav class="navbar navbar-expand-md navbar-light">
        <div class="container">
            <a class="navbar-brand" href="https://ct.conalep.edu.mx/home">
                <img src="https://ct.conalep.edu.mx/images/logoconalep.png" alt="CONALEP">
            </a>
        </div>
    </nav>
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card bg-light">
                        <div class="card-header"><i class="fa fa-certificate"></i> Validación de certificados Modelo 2018</div>
                        <div class="card-body">
                            <form onsubmit="return buscarFolio()">
                                <div class="form-group">
                                    <label>Ingresa el folio:</label>
                                    <input type="text" id="f" class="form-control" placeholder="CBG3760391305" required>
                                </div>
                                <button class="btn btn-primary"><i class="fa fa-search"></i> Buscar</button>
                            </form>
                            <hr>
                            <div id="avisoResultado"></div>
                            <div id="datosCertificado"></div>
                            <div class="text-right mt-3">
                                <a href="https://www.conalep.edu.mx" target="_blank">Portal CONALEP</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
