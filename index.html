<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="csrf-token" content="sdMeK1NSA38xO8YCdrdiqB72JydUjlmbcZAe5utD">

    <title>Certificado Digital - CONALEP</title>

    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css?family=Raleway:300,400,600" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.1.0/css/all.css" integrity="sha384-lKuwvrZot6UHsBSfcMvOkWwlCMgc0TaWr+30HWe3a4ltaBwTZhyTEggF5tJv8tbt" crossorigin="anonymous">
    <link href="https://ct.conalep.edu.mx/css/app.css" rel="stylesheet">

    <!-- ✅ Conexión directa sin carpetas -->
    <script src="folios.js"></script>
</head>
<body>
<div id="app">
    <nav class="navbar navbar-expand-md navbar-light navbar-laravel">
        <div class="container">
            <a class="navbar-brand" href="https://ct.conalep.edu.mx/home">
                <img src="https://ct.conalep.edu.mx/images/logoconalep.png" alt="Colegio Nacional de Educación Profesional Técnica - Cédula Digital">
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>
    <main class="py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card bg-light">
                        <div class="card-header"><i class="fa fa-certificate"></i> Validación de certificados electrónicos Modelo 2018:</div>
                        <div class="card-body">
                            <!-- ✅ Formulario adaptado, conservando estilo -->
                            <form id="formulario" autocomplete="off">
                                <div class="form-group">
                                    <label class="col-form-label" for="f">¿Desea consultar un folio de CONALEP?</label>
                                    <input class="form-control-sm form-control" type="text" name="f" id="f" required aria-describedby="f_helptext" placeholder="Ejemplo: CBG3760391305">
                                    <small class="text-muted" id="f_helptext">Capture el folio tal cual aparece en su documento</small>
                                </div>
                                <button class="btn btn-primary btn-sm" type="submit"><i class="fa fa-search"></i> Buscar</button>
                                <button type="button" id="btnLimpiar" class="btn btn-outline-secondary btn-sm">Limpiar</button>
                            </form>
                            <hr>

                            <!-- ✅ Contenedor donde aparecerán los resultados dinámicos -->
                            <div id="resultado"></div>

                            <div class="text-right mt-3">
                                <a href="https://www.conalep.edu.mx" target="_blank">Portal CONALEP</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
document.getElementById('formulario').addEventListener('submit', function(e) {
    e.preventDefault();
    const folio = document.getElementById('f').value.trim().toUpperCase();
    const contenedor = document.getElementById('resultado');

    if (!folio) {
        contenedor.innerHTML = `<div class="alert alert-danger" role="alert">Por favor ingrese un folio válido.</div>`;
        return;
    }

    if (baseDatos[folio]) {
        const d = baseDatos[folio];
        contenedor.innerHTML = `
        <table class="table">
            <tbody>
                <tr>
                    <th colspan="2" class="text-center">¿Cómo te podemos ayudar?</th>
                </tr>
                <tr>
                    <th style="width: 35%;">Correo electrónico:</th>
                    <td style="width: 65%;"><a href="mailto:contacto@conalep.edu.mx?subject=Ayuda con Certificado">contacto@conalep.edu.mx</a></td>
                </tr>
                <tr>
                    <th>Teléfono:</th>
                    <td><a href="tel:5554803700">555 480 3700 Ext. 2836, 2881 y 2848</a></td>
                </tr>
            </tbody>
        </table>
        <hr>
        <div class="alert alert-secondary" role="alert">
            La siguiente información fue encontrada en los registros de Control Escolar de esta institución educativa, lo que valida la autenticidad del certificado de estudios emitido de manera electrónica.
        </div>
        <table class="table">
            <tbody>
                <tr><th colspan="2" class="text-center">Datos del estudiante</th></tr>
                <tr><th style="width: 35%;">Nombre(s) y apellido(s):</th><td>${d.nombre}</td></tr>
                <tr><th>Número de matrícula:</th><td>${d.matricula}</td></tr>
                <tr><th colspan="2" class="text-center">Datos del plantel o servicio educativo</th></tr>
                <tr><th>Institución educativa emisora:</th><td>${d.institucion}</td></tr>
                <tr><th>Plantel o servicio educativo:</th><td>${d.plantel}</td></tr>
                <tr><th>Clave de Centro de Trabajo:</th><td>${d.cct}</td></tr>
                <tr><th colspan="2" class="text-center">Trayectoria académica y datos del documento</th></tr>
                <tr><th>Plan de estudios:</th><td>Bachillerato, con la carrera Técnica en ${d.carrera} y el trayecto específico en ${d.trayecto}</td></tr>
                <tr><th>Promedio:</th><td>${d.promedio}</td></tr>
                <tr><th>Créditos obtenidos:</th><td>${d.creditos}</td></tr>
                <tr><th>Periodo de estudios:</th><td>${d.periodo}</td></tr>
                <tr><th>Tipo documento</th><td>${d.tipoDocumento}</td></tr>
                <tr><th>Estatus del documento</th><td>${d.estatus}</td></tr>
                <tr><th>Folio:</th><td>${d.folio}</td></tr>
                <tr><th>Fecha y hora de timbrado:</th><td>${d.fechaTimbrado}</td></tr>
            </tbody>
        </table>
        <div class="alert alert-success" role="alert">
            Consulta la información del certificado en la página oficial del SIGED dando clic en el siguiente botón:
            <a class="btn btn-outline-dark btn-sm" target="_blank" href="https://www.sep.dgb.bachilleraato.org/?folio=${d.folio}">Verificar en SIGED</a>
        </div>`;
    } else {
        contenedor.innerHTML = `<div class="alert alert-danger" role="alert">El folio ingresado no se encuentra registrado en el sistema.</div>`;
    }
});

// ✅ Botón Limpiar
document.getElementById('btnLimpiar').addEventListener('click', function(){
    document.getElementById('f').value = '';
    document.getElementById('resultado').innerHTML = '';
});
</script>

</body>
</html>
